# Deploys the portfolio-html folder to GitHub Pages on every push
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [claude/sleepy-clarke-k3cdzo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
